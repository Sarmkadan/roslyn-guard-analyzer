# Docker Compose configuration for Roslyn Guard Analyzer v2
# Supports containerized analysis and CI/CD integration
# =============================================================================

services:
  analyzer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: roslyn-guard-analyzer
    image: roslyn-guard-analyzer:2.0.0
    restart: unless-stopped

    # Mount source code for analysis
    # Replace the volume mount below with your project directory
    volumes:
      - ./src:/workspace:ro
      - ./reports:/reports:rw

    # Working directory inside container
    working_dir: /workspace

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

    # Environment variables
    environment:
      - DOTNET_ENVIRONMENT=Production
      - ANALYSIS_TIMEOUT=600

    # Command to run the analyzer with a sample project
    # Edit this line to point to your project file (.csproj) or directory
    # Example: command: "/workspace/YourProject/YourProject.csproj"
    # For directory analysis: command: "/workspace/YourProject"
    command: "/workspace/RoslynGuardAnalyzer/RoslynGuardAnalyzer.csproj"

    # Logging configuration
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  reports:
    driver: local

networks:
  default:
    name: analyzer-network
